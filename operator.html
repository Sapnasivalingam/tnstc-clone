<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNSTC Operator Login</title>
    <link rel="stylesheet" href="./operator.css">
</head>

<body>

    <div class="page">

        <!-- HEADER -->
        <header>

            <img src="./bus.png" class="left-bus">

            <div class="logo-area">
                <img src="./logo.png" class="logo">

                <h2>தமிழ்நாடு அரசு போக்குவரத்துக் கழகம்</h2>

                <h3>
                    Tamil Nadu State Transport Corporation Ltd.
                </h3>

                <p>
                    (A GOVERNMENT OF TAMILNADU UNDERTAKING)
                </p>
            </div>

            <img src="./bus.png" class="right-bus">

        </header>


        <!-- TITLE BAR -->

        <div class="title-bar">
            TNSTC Operator Login
        </div>


        <!-- LOGIN AREA -->

        <main>

            <div class="login-box">

                <div class="login-title">
                    TNSTC Operator Login
                </div>

                <div class="input-row">
                    <label>Username :</label>
                    <input type="text">
                </div>

                <div class="input-row">
                    <label>Password :</label>
                    <input type="password">
                </div>

                <div class="buttons">
                    <button>Login</button>
                    <button>Reset</button>
                </div>

            </div>

        </main>


        <!-- FOOTER -->

        <footer>

            <div class="powered">
                <i>Powered by</i>
                <b>Radiantinfo</b>
            </div>

            <div class="bottom-bar">
                <a href="#">Home</a>
                |
                <span>Ver:23092026#22:00</span>
            </div>

        </footer>

    </div>

</body>
</html>
